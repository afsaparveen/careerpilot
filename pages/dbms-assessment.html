<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DBMS Assessment</title>

    <link
        rel="stylesheet"
        href="../css/dbms-assessment.css">

</head>


<body>


<header class="assessment-header">

    <h1 id="assessmentTitle">
        DBMS Chapter Test
    </h1>

    <p>
        Passing Score:
        <strong>75%</strong>
    </p>

</header>


<main class="assessment-container">


    <div
        id="questionsContainer">
    </div>


    <button
        id="submitBtn"
        class="submit-btn">

        Submit Test

    </button>


    <div
        id="result"
        class="result">
    </div>


    <button
        id="retryBtn"
        class="retry-btn">

        Retake Test

    </button>


    <button
        id="backBtn"
        class="back-btn">

        Back to Chapter

    </button>


</main>


<script
    src="../js/technical/dbms-assessment.js">
</script>

</body>

</html>
