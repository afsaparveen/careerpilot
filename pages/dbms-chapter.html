<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DBMS Chapter</title>

    <link
        rel="stylesheet"
        href="../css/dbms-chapter.css">

</head>


<body>


<header class="chapter-header">

    <div>

        <div id="chapterNumber">
            Chapter 1
        </div>

        <h1 id="chapterTitle">
            Loading...
        </h1>

    </div>


    <div class="chapter-progress">

        <span id="chapterProgressText">
            0%
        </span>

        <div class="chapter-progress-bar">

            <div
                id="chapterProgressFill">
            </div>

        </div>

    </div>

</header>



<main class="chapter-container">


    <!-- TOPIC SIDEBAR -->

    <aside class="topic-sidebar">

        <h2>
            Topics
        </h2>

        <div id="topicList"></div>

    </aside>



    <!-- LESSON -->

    <section class="lesson-content">


        <div class="lesson-breadcrumb">

            <span id="breadcrumb">
                Chapter
            </span>

            <span>
                →
            </span>

            <span id="topicCounter">
                Topic
            </span>

        </div>


        <h2 id="topicTitle">
            Loading...
        </h2>


        <!-- LEARN -->

        <section class="lesson-card learn">

            <div class="card-title">

                <h3>
                    Learn
                </h3>

            </div>

            <p id="learnText"></p>

        </section>


        <!-- EXAMPLE -->

        <section class="lesson-card example">

            <div class="card-title">

                <h3>
                    Example
                </h3>

            </div>

            <p id="exampleText"></p>

        </section>


        <!-- KEY POINTS -->

        <section class="lesson-card keypoints">

            <div class="card-title">

                <h3>
                    Key Points
                </h3>

            </div>

            <ul id="keyPoints"></ul>

        </section>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                id="previousBtn"
                class="btn previous">

                ← Previous

            </button>


            <div class="action-right">

                <button
                    id="completeBtn"
                    class="btn complete">

                    Complete Topic

                </button>


                <button
                    id="nextBtn"
                    class="btn next">

                    Next Topic →

                </button>


                <button
                    id="testBtn"
                    class="btn test">

                    Take Chapter Test

                </button>

            </div>

        </div>


        <div
            id="message"
            class="message">
        </div>


    </section>

</main>



<script src="../js/technical/dbms-chapter.js"></script>

</body>

</html>
