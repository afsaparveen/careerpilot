<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Presentation Layer Assessment | CareerPilot</title>

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/os-assessment.css" />
</head>

<body>

  <main class="assessment-page">

    <section class="assessment-card">

      <div class="assessment-header">
        <div>
          <span class="assessment-badge">Computer Networks</span>
          <h1>Presentation Layer Assessment</h1>
          <p>
            Chapter 8 · 10 Questions · Pass Mark: 75%
          </p>
        </div>
      </div>

      <div id="loadingState" class="assessment-status">
        Loading assessment...
      </div>

      <form id="assessmentForm" class="assessment-form hidden"></form>

      <div id="resultSection" class="result-section hidden">
        <div class="result-icon" id="resultIcon"></div>

        <h2 id="resultTitle"></h2>

        <p id="resultMessage"></p>

        <div class="result-score">
          <span id="scoreText"></span>
          <span id="percentageText"></span>
        </div>

        <div class="result-actions">
          <button id="retryBtn" class="btn btn-secondary" type="button">
            Retry Assessment
          </button>

          <button id="continueBtn" class="btn btn-primary" type="button">
            Continue to Computer Networks
          </button>
        </div>
      </div>

    </section>

  </main>

  <script type="module" src="../js/technical/cn-presentation-layer-assessment.js"></script>

</body>
</html>
