<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CN Final Assessment | CareerPilot</title>

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/os-assessment.css" />
</head>

<body>

  <main class="assessment-page">

    <section class="assessment-card">

      <div class="assessment-header">

        <div>

          <span class="assessment-badge">
            Computer Networks
          </span>

          <h1>
            Final Assessment
          </h1>

          <p>
            35 Questions · Pass Mark: 75% · 27/35 Required
          </p>

        </div>

      </div>


      <div
        id="loadingState"
        class="assessment-status"
      >
        Loading final assessment...
      </div>


      <div
        id="progressBarContainer"
        class="assessment-progress hidden"
      >
        <div
          id="progressBar"
          class="assessment-progress-bar"
        ></div>
      </div>


      <form
        id="assessmentForm"
        class="assessment-form hidden"
      ></form>


      <div
        id="resultSection"
        class="result-section hidden"
      >

        <div
          id="resultIcon"
          class="result-icon"
        >
        </div>


        <h2 id="resultTitle"></h2>


        <p id="resultMessage"></p>


        <div class="result-score">

          <span id="scoreText"></span>

          <span id="percentageText"></span>

        </div>


        <div class="result-actions">

          <button
            id="retryBtn"
            class="btn btn-secondary"
            type="button"
          >
            Retry Assessment
          </button>


          <button
            id="continueBtn"
            class="btn btn-primary"
            type="button"
          >
            View CN Completion
          </button>

        </div>

      </div>

    </section>

  </main>


  <script
    type="module"
    src="../js/technical/cn-final-assessment.js"
  ></script>

</body>
</html>
